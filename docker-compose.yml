services:
  app:
    build:
      context: .
      target: app
    image: inventarisinvesta-app:latest
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_PORT: ${APP_PORT:-8082}
      APP_BIND: ${APP_BIND:-127.0.0.1}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: ${DOCKER_REDIS_PORT:-6381}
      RUN_MIGRATIONS: "true"
    network_mode: host
    volumes:
      - storage:/app/storage
      - /var/run/mysqld:/var/run/mysqld
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:${APP_PORT:-8082}/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:${DOCKER_REDIS_PORT:-6381}:6379"
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis:
  storage:
